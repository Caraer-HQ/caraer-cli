[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caraer-cli"
version = "0.1.1"
description = "Developer CLI for Caraer apps, webhooks, and serverless functions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
  { name = "Caraer" },
]
keywords = ["caraer", "cli", "serverless", "apps", "marketplace"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "typer>=0.12.3",
  "rich>=13.7.1",
  "questionary>=2.0.1",
  "platformdirs>=4.2.2",
  "PyYAML>=6.0.1",
  "keyring>=25.2.1",
  "python-dotenv>=1.0.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "build>=1.2.1",
]
schemas = [
  "jsonschema>=4.22.0",
]

[project.scripts]
caraer = "caraer_cli.main:run"

[project.urls]
Homepage = "https://caraer.com"
Documentation = "https://developer.caraer.com"

[tool.hatch.build.targets.wheel]
packages = ["caraer_cli"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "caraer_cli/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
