name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: published-cli-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: published-cli-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  record-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: published-cli-distributions
          path: dist
      - name: Export the released CLI command contract
        run: |
          pip install dist/*.whl
          python scripts/export_cli_contract.py > command-tree.json
          python - <<'PYTHON'
          import json, os, tomllib
          from pathlib import Path
          value={'sourceRepository':os.environ['GITHUB_REPOSITORY'],'sourceSha':os.environ['GITHUB_SHA'],'version':tomllib.loads(Path('pyproject.toml').read_text())['project']['version'],'tree':json.loads(Path('command-tree.json').read_text())}
          Path('cli-contract.json').write_text(json.dumps(value,indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: developer-client-contract-cli
          path: cli-contract.json
          retention-days: 90
      - name: Record the published CLI distributions
        run: |
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/record_developer_release.py --kind pypi --version "$release_version" --dist dist --output developer-release-cli.json
      - uses: actions/upload-artifact@v4
        with:
          name: developer-release-cli
          path: developer-release-cli.json
          retention-days: 90
      - name: Notify developer documentation assessment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Developer docs notification skipped. Set DOCS_DISPATCH_TOKEN with Contents write access to Caraer-HQ/caraer-developer."
            exit 0
          fi
          gh api --method POST repos/Caraer-HQ/caraer-developer/dispatches -f event_type=developer-release
