name: Check PyPI Trusted Publisher

on:
  push:
    branches:
      - codex/check-pypi-trusted-publisher

permissions: {}

jobs:
  check-pypi-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Verify GitHub identity with PyPI
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          def request_json(request, service):
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise SystemExit(f"{service} rejected the request (HTTP {error.code})") from None
              except (urllib.error.URLError, TimeoutError, ValueError):
                  raise SystemExit(f"Could not get a valid response from {service}") from None

          endpoint = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in endpoint else "?"
          identity = request_json(
              urllib.request.Request(
                  f"{endpoint}{separator}audience=pypi",
                  headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
              ),
              "GitHub OIDC",
          )["value"]
          result = request_json(
              urllib.request.Request(
                  "https://pypi.org/_/oidc/mint-token",
                  data=json.dumps({"token": identity}).encode(),
                  headers={"Content-Type": "application/json"},
              ),
              "PyPI Trusted Publishing",
          )
          if not result.get("success") or not result.get("token", "").startswith("pypi-"):
              raise SystemExit("PyPI did not return a publishing token")
          print("PyPI accepted the GitHub workflow identity. No distribution was uploaded.")
          PY
