name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - name: Require API_TOKEN secret
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::error::Missing secrets.API_TOKEN. Add a PyPI API token (pypi-...) as repository or 'pypi' environment secret named API_TOKEN, then re-run."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: published-cli-distributions
          path: dist/*
          retention-days: 90
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.API_TOKEN }}


  record-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: published-cli-distributions
          path: dist
      - name: Export the released CLI command contract
        run: |
          pip install dist/*.whl
          python scripts/export_cli_contract.py > command-tree.json
          python - <<'PYTHON'
          import json, os, tomllib
          from pathlib import Path
          value={'sourceRepository':os.environ['GITHUB_REPOSITORY'],'sourceSha':os.environ['GITHUB_SHA'],'version':tomllib.loads(Path('pyproject.toml').read_text())['project']['version'],'tree':json.loads(Path('command-tree.json').read_text())}
          Path('cli-contract.json').write_text(json.dumps(value,indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: developer-client-contract-cli
          path: cli-contract.json
          retention-days: 90
      - name: Record the published CLI distributions
        run: |
          release_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/record_developer_release.py --kind pypi --version "$release_version" --dist dist --output developer-release-cli.json
      - uses: actions/upload-artifact@v4
        with:
          name: developer-release-cli
          path: developer-release-cli.json
          retention-days: 90
      - name: Notify developer documentation assessment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN || secrets.CARAER_HQ_GITHUB_TOKEN }}
        run: |
          printf '%s' '{"event_type":"developer-release"}' | gh api --method POST repos/Caraer-HQ/caraer-docs/dispatches --input -
