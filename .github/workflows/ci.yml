name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Resolve pinned CMS runtime
        id: cms-runtime
        run: |
          python - <<'PYTHON'
          import os
          import runpy
          pins = runpy.run_path("caraer_cli/project/cms_pins.py")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={pins['PUBLISHED_RUNTIME_TAG']}\n")
          PYTHON
      - name: Check out pinned CMS runtime
        uses: actions/checkout@v4
        with:
          repository: Caraer-HQ/caraer-cms-runtime
          ref: ${{ steps.cms-runtime.outputs.tag }}
          path: .ci/caraer-cms-runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install TypeScript
        run: npm install --global typescript@5.6.3
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        env:
          CARAER_CMS_RUNTIME_ROOT: ${{ github.workspace }}/.ci/caraer-cms-runtime
        run: pytest tests/unit -q
      - name: Build wheel
        run: |
          pip install build
          python -m build
      - name: CLI help
        run: caraer --help
