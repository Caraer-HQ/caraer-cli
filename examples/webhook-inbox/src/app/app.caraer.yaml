# yaml-language-server: $schema=https://raw.githubusercontent.com/caraer/caraer-cli/main/schemas/app.caraer.schema.json
label: Webhook Inbox
name: webhook_inbox
runtime: nodejs22
authMethod: API_KEY
oauthRedirectUris: []
details:
  brandColor: "#0F766E"
  category: developer_tools
  description: >
    Catch HTTP webhooks into installation state. Useful as a starter for
    inbound routes, jobs, settings, and app bars.
  image: https://www.svgrepo.com/show/448238/webhook.svg
  index: 2147483647
  subcategories:
    - apis
  textColor: "#FFFFFF"
  title: Webhook Inbox
  url: https://caraer.com
requiredScopes: []
settingsSchema:
  - name: inbox_label
    label: Inbox label
    type: SINGLE_LINE
    required: false
    defaultValue: Default inbox
    helpText: Shown in catch responses and stored with each event.
  - name: max_events
    label: Max events to keep
    type: SINGLE_LINE
    required: false
    defaultValue: "20"
    helpText: How many recent payloads to retain in installation state (1–100).
appBars:
  - location: RECORD_PREVIEW
    label: Clear inbox
    tooltipLabel: Wipe stored webhook events for this installation
    description: Calls clear-inbox to reset installation state events.
    webhook:
      topic: app.bar.triggered
      deliveryMode: SERVERLESS
      serverlessFunction:
        name: clear-inbox
pricingPlans:
  - title: Free
    description: Included with your Caraer workspace
    pricingType: FLAT
    pricePerUnit: 0
    unit: month
    freeUnits: 0
    freeUnitsPeriod: month
webhookRateLimitPerMinute: 100
jobRateLimitPerMinute: 30
billFailedWebhookRequests: false
