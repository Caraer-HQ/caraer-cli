# yaml-language-server: $schema=https://raw.githubusercontent.com/Caraer-HQ/caraer-app-schemas/main/schemas/app.caraer.schema.json
label: Example
name: example
runtime: nodejs22
authMethod: API_KEY
hideApiKeyField: true
oauthRedirectUris:
  - http://localhost:3000/oauth/callback
requiredScopes:
  - records.<setting:target_object>.all
  - records.<setting:due_date.objectName>.all
  - records.<setting:due_date.objectName>.property.<setting:due_date.propertyName>.all
  - records.<setting:field_map.objectName>.all
webhookRateLimitPerMinute: 100
jobRateLimitPerMinute: 60
# Settings: src/app/settings.yaml
# App bars: src/app/appbars/<name>.js (exports.manifest.appBars)
# Functions: src/app/functions/<name>.js (serverless webhooks on that file)
# HTTP webhooks: src/app/webhooks/<name>.yaml
# Lifecycle / inbound / schedules: matching folders of named files
