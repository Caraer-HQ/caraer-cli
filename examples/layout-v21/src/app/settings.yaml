- name: display_name
  type: SINGLE_LINE
  label: Display name
  helpText: Returned by hello-world, inbound echo, and the heartbeat.
  defaultValue: Layout 2026.2.1
  section: General
  sectionSubtitle: How this install identifies itself
- name: log_events
  type: SWITCH
  label: Log inbound events
  helpText: When on, inbound echo writes lastInboundAt to installation state.
  defaultValue: true
  section: General
- name: target_object
  type: OBJECT_SINGLE_SELECT
  label: Record object
  helpText: hello-world runs on record.<this>.created. After install the Webhooks tab shows that object (for example Candidate created).
  required: true
  section: Records
  sectionSubtitle: Object used in the record-created webhook topic
- name: due_date
  type: PROPERTY_SINGLE_SELECT
  label: Due date
  helpText: due-date runs on record.<this.objectName>.date_due.<this.propertyName> at offset 0. The Webhooks tab shows the resolved title (for example Availability date due).
  required: true
  section: Records
  filterPropertyTypes:
    - date
- name: field_map
  type: MAPPING
  label: Field map
  helpText: Optional mapping example. Grants records.<this.objectName>.all. No webhook uses these rows.
  section: Records
  mappingValue:
    items:
      - fieldName: email
        fieldLabel: Email
      - fieldName: phone
        fieldLabel: Phone
