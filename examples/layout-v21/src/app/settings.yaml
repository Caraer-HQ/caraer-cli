- name: display_name
  type: SINGLE_LINE
  label: Display name
  helpText: Returned by hello-world, inbound echo, and the heartbeat.
  defaultValue: Layout 2026.2.1
  section: General
  sectionSubtitle: How this install identifies itself
- name: log_events
  type: SWITCH
  label: Log inbound events
  helpText: When on, inbound echo writes lastInboundAt to installation state.
  defaultValue: true
  section: General
- name: target_object
  type: OBJECT_SINGLE_SELECT
  label: Record object
  helpText: Install and update subscribe hello-world to record.<this>.created.
  required: true
  section: Records
  sectionSubtitle: Object chosen at install time. Not a webhook topic placeholder.
- name: due_date
  type: PROPERTY_SINGLE_SELECT
  label: Due date
  helpText: Fills record.<this.objectName>.date_due.<this.propertyName> on due-date.
  required: true
  section: Records
- name: field_map
  type: MAPPING
  label: Field map
  helpText: field-map reads the email row with <setting:field_map.email>.
  required: true
  section: Records
  mappingValue:
    items:
      - fieldName: email
        fieldLabel: Email
      - fieldName: phone
        fieldLabel: Phone
